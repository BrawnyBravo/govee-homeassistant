name: Sync with upstream

# Keeps this fork's main branch level with the upstream project.
# Runs every day; if the merge conflicts, it backs out and opens an issue here.
#
# Tags are deliberately NOT followed in either direction. This fork carries its
# own "-house.N" version in manifest.json, and republishing upstream's release
# tags from here would make the fork's version indistinguishable from upstream's.
#
# EXPECTED CONFLICT: custom_components/govee/manifest.json conflicts on every
# sync where upstream bumps its version, because both sides edit the same line.
# That is by design, not a problem. When it is the ONLY conflict, the job settles
# it itself: upstream's new version with the fork suffix kept, e.g. upstream
# 2026.9.7 -> "2026.9.7-house.1". Any other conflict still backs out and opens
# an issue. See FORK-NOTES.md. A conflict is resolved, never left to drift.
#
# WORKFLOW FILES: .github/workflows/** always stays exactly as the fork has it;
# upstream's changes there are never taken. This job's token has no `workflows`
# permission, so GitHub refuses any push that changes a workflow file (every run
# failed this way from 2026-10-23). The fork also runs its own set: inherited
# upstream jobs it does not want are disabled in Actions settings, not deleted.
# To adopt an upstream workflow change, copy it across by hand in a pull request.
#
# Do NOT create GitHub Releases on this fork without reading the install notes in
# PLAN.md first: for the Govee fork a release silently switches HACS from tracking
# the default branch to tracking releases.

# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: "17 9 * * *" # 09:17 UTC daily
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream branch to merge from (default: main)"
        required: false
        default: main
      target_branch:
        description: "Branch in this fork to merge into (default: main)"
        required: false
        default: main

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream-${{ inputs.target_branch || 'main' }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # Pin every gh call to THIS fork. The job adds an 'upstream' remote, and gh
      # prefers a remote named upstream as the base repo - which aimed label and
      # issue writes at the maintainer's repository instead of this fork.
      GH_REPO: ${{ github.repository }}
      UPSTREAM: lasswellt/govee-homeassistant
      BRANCH: ${{ inputs.target_branch || 'main' }}
      UPSTREAM_REF: ${{ inputs.upstream_ref || 'main' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # Dates in this repo are read in the maintainer's local timezone, not the runner's.
      TZ: America/Los_Angeles
    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch || 'main' }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream "https://github.com/${UPSTREAM}.git" 2>/dev/null || \
            git remote set-url upstream "https://github.com/${UPSTREAM}.git"
          git fetch upstream "${UPSTREAM_REF}"

      - name: Merge upstream
        id: merge
        run: |
          # The version line is the fork's one deliberate divergence. Settle it
          # by taking upstream's version and re-adding the fork suffix; fail
          # closed if either side does not look the way FORK-NOTES.md says.
          resolve_manifest() {
            local file="$1"
            SUFFIX="$(git show "HEAD:${file}" \
              | sed -n 's/.*"version": *"[0-9.]*\(-house\.[0-9]*\)".*/\1/p')"
            UP_VER="$(git show "upstream/${UPSTREAM_REF}:${file}" \
              | sed -n 's/.*"version": *"\([0-9.]*\)".*/\1/p')"
            [ -n "${SUFFIX}" ] && [ -n "${UP_VER}" ] || return 1
            git checkout --theirs -- "${file}" || return 1
            sed -i "s/\"version\": *\"${UP_VER}\"/\"version\": \"${UP_VER}${SUFFIX}\"/" "${file}"
            grep -qF "\"version\": \"${UP_VER}${SUFFIX}\"" "${file}" || return 1
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "${file}" || return 1
          }

          # Put every workflow file back to the fork's own copy: drop files
          # upstream added, restore ones it changed or deleted, settle any
          # conflict there to the fork side. Fails if anything is left over.
          WF=".github/workflows"
          keep_fork_workflows() {
            local head_list="${RUNNER_TEMP}/wf-head" index_list="${RUNNER_TEMP}/wf-index" f
            git ls-tree -r --name-only HEAD -- "${WF}" | sort > "${head_list}"
            git ls-files -- "${WF}" | sort -u > "${index_list}"
            comm -13 "${head_list}" "${index_list}" | while IFS= read -r f; do
              git rm -q -f -- "${f}" || exit 1
            done || return 1
            if [ -s "${head_list}" ]; then
              git checkout HEAD -- "${WF}" || return 1
            fi
            [ -z "$(git diff --name-only --diff-filter=U -- "${WF}")" ] || return 1
            git diff --cached --quiet HEAD -- "${WF}" || return 1
            [ -z "$(git status --porcelain -- "${WF}")" ] || return 1
          }

          BEFORE="$(git rev-parse HEAD)"
          UPSTREAM_HEAD="$(git rev-parse "upstream/${UPSTREAM_REF}")"
          echo "upstream_head=${UPSTREAM_HEAD}" >> "$GITHUB_OUTPUT"

          if [ "$(git rev-list --count "HEAD..upstream/${UPSTREAM_REF}")" -eq 0 ]; then
            echo "result=up-to-date" >> "$GITHUB_OUTPUT"
            echo "Already level with upstream."
            exit 0
          fi

          # Never commit straight from the merge: the workflow files have to be
          # put back first, and --no-ff stops a fast-forward bringing them in.
          git merge --no-commit --no-ff "upstream/${UPSTREAM_REF}" || true
          if ! git rev-parse -q --verify MERGE_HEAD > /dev/null; then
            # No merge in progress means git refused to start one (dirty tree,
            # unrelated histories...). Nothing to undo; report it.
            CONFLICTS=""
          elif ! keep_fork_workflows; then
            echo "::error::could not put ${WF} back to the fork's copy"
            CONFLICTS="$(git diff --name-only --diff-filter=U || true)"
            [ -n "${CONFLICTS}" ] || CONFLICTS="${WF} (could not keep the fork's copy)"
          else
            # Read the unmerged paths BEFORE aborting; the abort clears them.
            CONFLICTS="$(git diff --name-only --diff-filter=U || true)"
            MANIFEST="custom_components/govee/manifest.json"
            MESSAGE=""
            if [ -z "${CONFLICTS}" ]; then
              MESSAGE="Merge upstream ${UPSTREAM}@${UPSTREAM_REF}"
            elif [ "${CONFLICTS}" = "${MANIFEST}" ] && resolve_manifest "${MANIFEST}"; then
              git add "${MANIFEST}"
              MESSAGE="Merge upstream v${UP_VER}"
              echo "Version line settled: ${UP_VER}${SUFFIX}"
            fi
            if [ -n "${MESSAGE}" ]; then
              if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
                echo "::error::unexpected unmerged paths after resolving conflicts"
                exit 1
              fi
              git commit -q -m "${MESSAGE}" \
                -m "The fork's own ${WF} is kept; upstream workflow changes are not taken (see sync-upstream.yml)."
              # Belt and braces: the push below is refused if this is wrong.
              if ! git diff --quiet "${BEFORE}" HEAD -- "${WF}"; then
                echo "::error::merge commit changes ${WF}; refusing to push"
                exit 1
              fi
              echo "result=merged" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if git rev-parse -q --verify MERGE_HEAD > /dev/null; then
            git merge --abort || true
          fi
          echo "result=conflict" >> "$GITHUB_OUTPUT"
          echo "conflicts<<CONFLICT_LIST" >> "$GITHUB_OUTPUT"
          echo "${CONFLICTS}" >> "$GITHUB_OUTPUT"
          echo "CONFLICT_LIST" >> "$GITHUB_OUTPUT"
          if [ "$BEFORE" != "$(git rev-parse HEAD)" ]; then
            echo "::error::abort left ${BRANCH} moved; refusing to continue"
            exit 1
          fi

      - name: Push merged branch
        if: steps.merge.outputs.result == 'merged'
        run: git push origin "HEAD:${BRANCH}"

      - name: Close resolved conflict issues
        if: steps.merge.outputs.result != 'conflict'
        run: |
          # Only close alerts raised for THIS ref pair, so a self-test run cannot
          # close a live main-to-main alert.
          SUFFIX="@${UPSTREAM_REF} -> ${BRANCH}"
          gh issue list --state open --label upstream-sync \
            --json number,title \
            --jq ".[] | select(.title | endswith(\"${SUFFIX}\")) | .number" \
            > stale.txt || true
          while read -r n; do
            [ -n "$n" ] || continue
            gh issue comment "$n" \
              --body "Upstream merged cleanly on $(date '+%Y-%m-%d'). Closing."
            gh issue close "$n"
          done < stale.txt

      - name: Report conflict
        if: steps.merge.outputs.result == 'conflict'
        env:
          UPSTREAM_HEAD: ${{ steps.merge.outputs.upstream_head }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
        run: |
          # Best effort. A fork inherits no labels, and label creation can fail for
          # reasons unrelated to the conflict being reported - so never let it
          # decide whether the conflict gets reported at all.
          gh label create upstream-sync \
            --description "Automated upstream sync" --color B60205 \
            || echo "note: could not create the upstream-sync label; continuing unlabelled"

          TITLE="Upstream sync conflict: ${UPSTREAM}@${UPSTREAM_REF} -> ${BRANCH}"
          # Fingerprints this exact conflict, so a persistent one is reported once
          # instead of every morning until somebody mutes the repository.
          MARKER="<!-- sync-upstream-state: ${UPSTREAM_HEAD} -->"

          EXISTING="$(gh issue list --state open --label upstream-sync \
                       --json number,title \
                       --jq ".[] | select(.title == \"${TITLE}\") | .number" \
                       | head -n1 || true)"

          if [ -n "${EXISTING}" ]; then
            SEEN="$(gh issue view "${EXISTING}" --json body,comments \
                      --jq '[.body] + [.comments[].body] | join("\n")' || true)"
            if printf '%s' "${SEEN}" | grep -qF "${MARKER}"; then
              echo "Same conflict against the same upstream commit ${UPSTREAM_HEAD}."
              echo "Already reported on issue #${EXISTING}; staying quiet."
              exit 0
            fi
          fi

          BODY_FILE="$(mktemp)"
          {
            printf 'The upstream sync could not merge `%s@%s` into this fork.\n\n' \
              "${UPSTREAM}" "${UPSTREAM_REF}"
            printf 'Nothing was pushed; `%s` is exactly where it was.\n\n' "${BRANCH}"
            printf '**Upstream commit:** `%s`\n\n' "${UPSTREAM_HEAD}"
            if [ -n "${CONFLICTS}" ]; then
              printf '**Conflicting files:**\n\n'
              printf '```\n%s\n```\n\n' "${CONFLICTS}"
              if printf '%s' "${CONFLICTS}" | grep -qx 'custom_components/govee/manifest.json'; then
                printf '`manifest.json` is an expected conflict: take upstream'"'"'s new\n'
                printf 'version and keep the `-house.N` suffix. See FORK-NOTES.md.\n\n'
              fi
            else
              printf '**No file-level conflicts were reported.** The merge failed for\n'
              printf 'some other reason - unrelated histories, an unclean index, or\n'
              printf 'files that would be overwritten. The run log has the real error:\n'
              printf '%s\n\n' "${RUN_URL}"
            fi
            printf 'To resolve locally:\n\n'
            printf '```sh\n'
            printf 'git fetch upstream %s\n' "${UPSTREAM_REF}"
            printf 'git checkout %s\n' "${BRANCH}"
            printf 'git merge upstream/%s\n' "${UPSTREAM_REF}"
            printf '# fix the conflicts, then\n'
            printf 'git commit && git push origin %s\n' "${BRANCH}"
            printf '```\n\n'
            printf 'This issue closes itself once a later run merges cleanly, and it\n'
            printf 'will not be commented on again unless the upstream commit changes.\n\n'
            printf 'Run: %s\n\n' "${RUN_URL}"
            printf '%s\n' "${MARKER}"
          } > "${BODY_FILE}"

          if [ -n "${EXISTING}" ]; then
            gh issue comment "${EXISTING}" --body-file "${BODY_FILE}"
          else
            # An issue that exists unlabelled beats a clean exit nobody sees.
            gh issue create --title "${TITLE}" --label upstream-sync \
              --body-file "${BODY_FILE}" \
              || gh issue create --title "${TITLE}" --body-file "${BODY_FILE}"
          fi
          exit 1
